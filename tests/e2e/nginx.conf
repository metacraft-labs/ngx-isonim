# nginx configuration for tests/e2e/test_e2e.sh.
#
# A template: test_e2e.sh replaces @MODULE@ (the module built with the
# end-to-end apps), @PREFIX@ (a private temporary directory), @PORT@, and
# the marker line inside the server block (extra locations for the
# configuration checks).

load_module @MODULE@;

worker_processes 1;
error_log @PREFIX@/error.log info;
pid @PREFIX@/nginx.pid;

events {
    worker_connections 64;
}

http {
    access_log off;
    client_body_temp_path @PREFIX@/client_body;
    proxy_temp_path @PREFIX@/proxy;
    fastcgi_temp_path @PREFIX@/fastcgi;
    uwsgi_temp_path @PREFIX@/uwsgi;
    scgi_temp_path @PREFIX@/scgi;

    server {
        listen 127.0.0.1:@PORT@;

        location /hello {
            isonim_ssr on;
            isonim_ssr_app hello;
            isonim_ssr_hydration off;
        }

        location /hello-buffered {
            isonim_ssr on;
            isonim_ssr_app hello;
            isonim_ssr_hydration off;
            isonim_ssr_mode buffered;
        }

        location /hello-hydrated {
            isonim_ssr on;
            isonim_ssr_app hello;
            isonim_ssr_hydration on;
        }

        location /tasks {
            isonim_ssr on;
            isonim_ssr_app tasks;
            isonim_ssr_hydration on;
        }

        location /async {
            isonim_ssr on;
            isonim_ssr_app async_dashboard;
            isonim_ssr_hydration on;
        }

        location /boom {
            isonim_ssr on;
            isonim_ssr_app boom;
        }

        location /unknown-app {
            isonim_ssr on;
            isonim_ssr_app no_such_app;
        }

        location /health {
            return 200 "ok";
        }

        # @EXTRA@ (test_e2e.sh inserts per-test locations here)
    }
}
